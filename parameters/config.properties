# Default Configuration
environment=staging
browserName=chromium
headless=false
projectName=CustomerFrontend
country=sg
appLanguage=en
ObjectWaitTime=30
VideoMode=on_failure
slowMo=
endExecutionOnFailure=true
debugMode=false

# Playwright trace: off | on | on_failure
# A trace records every action with its selector, plus a DOM snapshot and
# screenshot per step. Open the zip in Playwright Trace Viewer; the QA agent
# network reads the action timeline from it to see exactly which locator broke.
traceMode=on_failure

# ── Locator baselines ────────────────────────────────────────────────────────
# On a passing test, record what each page-object Locator actually matched: tag,
# role, accessible name, text, attributes, neighbouring text and geometry. When a
# locator later stops matching, that fingerprint is what makes the difference
# between diagnosing the change and guessing from a selector string.
#
# Written only for tests that PASS (a failing run's record is discarded), and
# never allowed to fail a test.
#
# Kept inside the repo rather than test-output/ so the files are reviewable and
# move in the same commit as the page objects they describe. CI discards
# test-output between builds, which is where they used to land.
# Override with -Dbaseline.dir=... or the BASELINE_DIR environment variable.
baselineDir=src/main/resources/baselines

# Set to false to skip fingerprinting. Costs one DOM walk per page object per
# test; the per-locator match counts are recorded either way.
# Override with -Dbaseline.fingerprints=false or BASELINE_FINGERPRINTS=false.
baselineFingerprints=true

# repairMode: park the browser on the failing page behind a CDP port so a fixing
# agent can attach to the live session. Local debugging only — never enable in CI,
# it deliberately leaks browsers.
repairMode=false
repairCdpPort=9222