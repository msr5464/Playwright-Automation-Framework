# AI Evaluation Configuration
# All thresholds and weights used by AIEvalHelper.

# Minimum overall score to pass (0.0 - 1.0)
aiEval.defaultMinScore=0.85

# Minimum score for high-risk test cases (0.0 - 1.0)
aiEval.highRiskMinScore=0.95

# Maximum allowed API response latency in milliseconds
aiEval.maxLatencyMs=8000

# Hard-fail the test if schema validation fails (true/false)
aiEval.failOnSchemaError=true

# Hard-fail the test if any forbidden code is detected (true/false)
aiEval.failOnForbiddenCode=true

# Dimension weights (must not need to sum to 1.0 - they are normalised internally)
aiEval.weight.codingAccuracy=0.40
aiEval.weight.safety=0.20
aiEval.weight.rationale=0.15
aiEval.weight.traceability=0.15
aiEval.weight.performance=0.10
