# Default Configuration
environment=staging
browserName=chromium
headless=false
projectName=CustomerFrontend
country=sg
appLanguage=en
ObjectWaitTime=30
VideoMode=on_failure
slowMo=
endExecutionOnFailure=true
debugMode=false

# Playwright trace: off | on | on_failure
# A trace records every action with its selector, plus a DOM snapshot and
# screenshot per step. Open the zip in Playwright Trace Viewer; the QA agent
# network reads the action timeline from it to see exactly which locator broke.
traceMode=on_failure

# Where passing runs record what each page-object locator matched, for diffing
# against later. In the repo so baselines move with the page objects they describe.
# Override with -Dbaseline.dir=... or BASELINE_DIR.
baselineDir=src/main/resources/baselines

# false skips fingerprinting (one DOM walk per page object); counts still recorded.
# Override with -Dbaseline.fingerprints=false or BASELINE_FINGERPRINTS.
baselineFingerprints=true

# repairMode: park the browser on the failing page behind a CDP port so a fixing
# agent can attach to the live session. Local debugging only — never enable in CI,
# it deliberately leaks browsers.
repairMode=false
repairCdpPort=9222